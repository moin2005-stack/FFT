<html> 
<head> 
    
    <title>Facebook Login page - Demo</title> 
        .left {           
             width: 400px; 
        } 
        .logo  {       
            color: #1877f2; 
            font-size: 56px; 
            font-weight: bold;<style> 
            
            
        * { 
            box-sizing: border-box;             
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif; 
        } 
 
        body { 
            background: #f0f2f5; 
        } 
 
        .container {             
            min-height: 100vh;             
            display: flex; 
            justify-content: center; 
            align-items: center;             
            gap: 80px; 
            padding: 20px; 
            margin-bottom: 10px;
        } 
             
        
 
        .tagline {             
            font-size: 24px;             
            line-height: 1.3; 
        } 
 
        .login-box {             
            width: 396px; 
            background: white;             
            padding: 16px; 
            border-radius: 8px; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);             
            text-align: center; 
        } 
         input { 
            width: 100%;             
            height: 52px; 
            border: 1px solid #dddfe2;             
            border-radius: 6px;             
            padding: 0 14px;             
            font-size: 17px; 
            margin-bottom: 12px; 
        } 
 
        input:focus { 
            outline: none; 
            border-color: #1877f2; 
        } 
 
        .login-btn {             
            width: 100%;             
            height: 48px;             
            background: #1877f2;             
            color: white; 
            border: none; 
            border-radius: 6px;             
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
        } 
 
        .login-btn:hover {             
            background: #166fe5; 
        } 
 
        .forgot {            
             display: block; 
            margin: 16px 0;             
            color: #1877f2; 
            text-decoration: none; 
            font-size: 14px; 
        } 
 
        .line {            
             border-top: 1px solid #dadde1;             
             margin: 20px 0; 
        } 
 
        .create-btn {            
             background: #42b72a;            
            color: white; 
            border: none; 
            padding: 14px 20px;             
            border-radius: 6px;             
            font-size: 17px; 
            font-weight: bold;             
            cursor: pointer; 
        } 
 
        .create-btn:hover {             
            background: #36a420; 
        } 
 
        .note {             
            margin-top: 25px;             
            font-size: 12px; 
            color: #777; 
        } 
 
        @media (max-width: 850px) { 
            .container {                 
                flex-direction: column;                 
                gap: 30px;           
              } 
 
            .left {                 
                text-align: center; 
            } 
        } 
    </style> 
</head 
<body> 
    <div class="container"> 
        <div class="left"> 
            <div class="logo">hyy</div> 
            <div class="tagline">                 open your facebook account and enjoy. 
            </div> 
        </div> 
        <div class="login-box"> 
            <form onsubmit="demoLogin(event)">                 
                <input                     type="text" 
                    placeholder="Email address or phone number" 
                    required                
                <input                     type="password" 
                    placeholder="Password" 
                    required 
                > 
                <button class="login-btn" type="submit"> 
                    Log In 
                </button> 
            </form 
            <a href="#" class="forgot">Forgotten password?</a> 
            <div class="line"></div 
            <button class="create-btn" onclick="alert('Demo only')">                 Create new account 
            </button             <div class="note"> 
                Demo login page . 
            </div> 
        </div> 
    </div> 
    <script> 
        function demoLogin(event) { 
            event.preventDefault() 
            alert("This is a demo login page. No credentials were sent or stored."); 
        } 
    </script> 
</body> 
</html>
