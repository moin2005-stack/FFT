<html > 
<head> 
     
    <title> Animation ball</title> 
 
    <style>         
    body { 
             
            margin: 0;
            height: 100vh;
            background: #181717;
            overflow: hidden; 
        } 
 
        .ball {             
             width: 80px;            
             height: 80px;             
             background: rgb(170, 9, 9);             
             border-radius: 50%;             
             position: absolute; 
 
            box-shadow: 
                0 0 20px rgb(184, 19, 19), 
                0 0 40px cyan, 
                0 0 80px cyan; 
 
            animation: moveBall 4s infinite alternate ease-in-out; 
        } 
 
        @keyframes moveBall { 
            0% {                 
                left: 0;                 
                top: 0;                 
                transform: scale(1); 
            } 
 
            25% {                 
                left: 80%;                 
                top: 10%;                 
                transform: scale(1.3); 
            } 
 
            50% {                 
                left: 70%;                 
                top: 70%;                 
                transform: scale(1); 
            } 
 
            75% {                 
                left: 20%;                 
                top: 80%;                 
                transform: scale(1.3);             
            } 
 
            100% {                 
                left: 0;                 
                top: 20%;                 
                transform: scale(1); 
            } 
        } 
    </style> 
</head> 
 
<body> 
 
    <div class="ball"></div> 
 
</body> 
 
</html>
