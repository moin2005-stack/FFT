<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            padding: 40px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .input-section {
            display: flex;
            gap: 10px;
        }

        #taskInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
        }

        #addBtn {
            background: #222;
            color: white;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 22px 0;
        }

        .filter {
            background: #eee;
        }

        .filter.active {
            background: #222;
            color: white;
        }

        .task-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #555;
        }

        #clearCompleted {
            background: #eee;
        }

        #taskList {
            list-style: none;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            margin-bottom: 10px;
        }

        .task-text {
            flex: 1;
            word-break: break-word;
        }

        .task.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .edit-btn {
            background: #e8f0fe;
        }

        .delete-btn {
            background: #feecec;
        }

        #emptyMessage {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        @media (max-width: 520px) {
            .input-section {
                flex-direction: column;
            }

            #addBtn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <p class="subtitle">
            Manage your daily tasks easily
        </p>

        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
            >

            <button id="addBtn">
                Add Task
            </button>

        </div>

        <div class="filters">

            <button class="filter active" data-filter="all">
                All
            </button>

            <button class="filter" data-filter="pending">
                Pending
            </button>

            <button class="filter" data-filter="completed">
                Completed
            </button>

        </div>

        <div class="task-info">

            <span id="taskCount">
                0 tasks
            </span>

            <button id="clearCompleted">
                Clear Completed
            </button>

        </div>

        <ul id="taskList"></ul>

        <p id="emptyMessage">
            No tasks yet. Add your first task!
        </p>

    </div>


    <script>

        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");
        const taskCount = document.getElementById("taskCount");
        const clearCompleted =
            document.getElementById("clearCompleted");
        const emptyMessage =
            document.getElementById("emptyMessage");

        const filterButtons =
            document.querySelectorAll(".filter");


        let tasks =
            JSON.parse(localStorage.getItem("todoTasks")) || [];

        let currentFilter = "all";


        function saveTasks() {

            localStorage.setItem(
                "todoTasks",
                JSON.stringify(tasks)
            );

        }


        function addTask() {

            const text = taskInput.value.trim();

            if (text === "") {

                alert("Please enter a task.");

                return;
            }


            const newTask = {

                id: Date.now(),

                text: text,

                completed: false

            };


            tasks.push(newTask);

            taskInput.value = "";

            saveTasks();

            displayTasks();

        }


        function editTask(id) {

            const task =
                tasks.find(item => item.id === id);

            const newText =
                prompt("Edit task:", task.text);


            if (
                newText !== null &&
                newText.trim() !== ""
            ) {

                task.text = newText.trim();

                saveTasks();

                displayTasks();

            }

        }


        function deleteTask(id) {

            tasks =
                tasks.filter(task => task.id !== id);

            saveTasks();

            displayTasks();

        }


        function toggleTask(id) {

            const task =
                tasks.find(item => item.id === id);

            task.completed = !task.completed;

            saveTasks();

            displayTasks();

        }


        function getFilteredTasks() {

            if (currentFilter === "pending") {

                return tasks.filter(
                    task => !task.completed
                );

            }


            if (currentFilter === "completed") {

                return tasks.filter(
                    task => task.completed
                );

            }


            return tasks;

        }


        function displayTasks() {

            taskList.innerHTML = "";


            const filteredTasks =
                getFilteredTasks();


            filteredTasks.forEach(task => {

                const li =
                    document.createElement("li");


                li.className = "task";


                if (task.completed) {

                    li.classList.add("completed");

                }


                li.innerHTML = `

                    <input
                        type="checkbox"
                        ${task.completed ? "checked" : ""}
                    >

                    <span class="task-text">
                        ${task.text}
                    </span>

                    <button class="edit-btn">
                        Edit
                    </button>

                    <button class="delete-btn">
                        Delete
                    </button>

                `;


                li.querySelector("input")
                    .addEventListener(
                        "change",
                        () => toggleTask(task.id)
                    );


                li.querySelector(".edit-btn")
                    .addEventListener(
                        "click",
                        () => editTask(task.id)
                    );


                li.querySelector(".delete-btn")
                    .addEventListener(
                        "click",
                        () => deleteTask(task.id)
                    );


                taskList.appendChild(li);

            });


            const pendingCount =
                tasks.filter(
                    task => !task.completed
                ).length;


            taskCount.textContent =
                ${pendingCount} pending / ${tasks.length} total;


            if (filteredTasks.length === 0) {

                emptyMessage.style.display = "block";

            } else {

                emptyMessage.style.display = "none";

            }

        }


        addBtn.addEventListener(
            "click",
            addTask
        );


        taskInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    addTask();

                }

            }
        );


        filterButtons.forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    filterButtons.forEach(btn => {

                        btn.classList.remove("active");

                    });


                    button.classList.add("active");


                    currentFilter =
                        button.dataset.filter;


                    displayTasks();

                }
            );

        });


        clearCompleted.addEventListener(
            "click",
            function() {

                tasks =
                    tasks.filter(
                        task => !task.completed
                    );

                saveTasks();

                displayTasks();

            }
        );


        displayTasks();

    </script>

</body>
</html>
